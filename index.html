<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios Avancado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Formulario Avancado</h2>

    <form>
        <label>Nome Completo</label>
        <input type="="text" id="nome" required minlength="3" maxlength="50">

        <fieldset>
            <legend>Escolha o Turno de Atendimento: </legend>
           
             <input type="radio" id="manha" name="turno" value="manha" required>
            <label>Manha</label>

            <input type="radio" id="Tarde" name="turno" value="Tarde" required>
            <label>Tarde</label>

             <input type="radio" id="Noite" name="turno" value="Noite" required>
            <label>Noite</label>
            
        </fieldset>
        
        <button type="submit">Salvar</button>
    </form>
</body>
</html>
